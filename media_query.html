<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @media (min-width: 320px) and (max-width: 767px){
            body{
                font-size: 20px;
                background-color: black;
                color: white;
            }
        }
            img{
                display: none;
            }
            @media (min-width:768px){
                body{
                    background-color: aqua;
                    color: black;
                }
            }
            @media (min-width:1024px){
                body{
                    font-style: italic;
                    background-color: burlywood;
                    color: brown;
                }
            }
            @media (min-width:1224px){
                body{
                    color: blueviolet;
                    font-size: xx-small;
                    text-shadow: palevioletred;
                }
            }
            @media (min-width:1824px){
                body{
                    color: blueviolet;
                    font-size: 70px;
                    text-wrap: wrap;

                }
                
            }
            @media (min-width:768px){
                img{
                    box-shadow: 0px 20px 10px solid;
                    background-color: brown;
                    display: block;

                }
            }


        
    </style>
</head>
<body>
    <h1>hello Dipali</h1>
    <h2>hello mahi</h2>
    <h3>hello purvi</h3>
    <h4>hello prisha</h4>
    <h5>hello divya</h5>
    <h6> hello tanuu </h6>
    <img src="image/1.png" alt="pikashu">

    
    
</body>
</html>
