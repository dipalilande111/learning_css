<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            position:relative;
            margin:100px;  
        }
        div{
            position: absolute;
            width:200px ;
            height:200px ;
            border-radius: 50%;
            text-align: center;
            font-size:25px ;
            margin: 100px;
        }
        .blue{
            background-color: rgb(22, 7, 235);
            left: 20px;
            z-index:2;
            color: white;
            border:8px solid rgb(40, 40, 18);
            align-items: center;
            justify-content: center;
            display:flex;
            align-items: center;    

        }
        .red{
            background-color: rgb(212, 36, 23);
            left:260px;
            z-index: 4;
            color: white;
            border:10px solid rgb(41, 41, 4);
            justify-content: center;
            display:flex;
            align-items: center;  
        }
        .green{
            background-color: rgb(16, 90, 10);
            left:140px;
            z-index: 6;
            color: white;
            border:10px solid rgb(18, 18, 3);
            justify-content: center;
            display:flex;
            align-items: center;  
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="blue">Blue</div>
        <div class="red">Red</div>
        <div class="green">Green</div>
    </div>
</body>
</html>
